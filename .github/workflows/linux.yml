name: Linux

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install a virtual display and Tk
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Install rddl-ide
        run: pip install -e . pillow
      - name: Run the tests, the GUI smoke test on a virtual display
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m unittest discover -s tests -t . -v
